name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, e.g. v0.2.17'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo '::error::Release tag must be vMAJOR.MINOR.PATCH and match VERSION.'
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Python tests and syntax
        timeout-minutes: 5
        run: |
          python -u -B - <<'PY'
          import faulthandler
          import sys
          import unittest
          class ImmediateErrors(unittest.TextTestResult):
              def addError(self, test, err):
                  super().addError(test, err)
                  self.stream.writeln(self._exc_info_to_string(err, test))
                  for field in ('stdout', 'stderr'):
                      output = getattr(err[1], field, None)
                      if output:
                          self.stream.writeln(str(output))
          faulthandler.dump_traceback_later(90, repeat=True)
          result = unittest.TextTestRunner(verbosity=2, failfast=True, resultclass=ImmediateErrors).run(unittest.defaultTestLoader.discover('tests'))
          faulthandler.cancel_dump_traceback_later()
          sys.exit(not result.wasSuccessful())
          PY
          python -m compileall -q app.py manage.py installer.py codex_usage scripts tests

      - name: JavaScript tests and syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.js; do node "$file"; done
          for file in static/*.js; do node --check "$file"; done

      - name: Build installer
        run: python -B scripts/build_release.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/token-lens-${RELEASE_TAG}-macos.zip"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --verify-tag --title "Token Lens ${RELEASE_TAG}" --generate-notes
