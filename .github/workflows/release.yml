name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::Release tag must be vMAJOR.MINOR.PATCH and match VERSION.'
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Python tests and syntax
        run: |
          python -B -m unittest discover -s tests
          python -m compileall -q app.py manage.py installer.py codex_usage scripts tests

      - name: JavaScript tests and syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.js; do node "$file"; done
          for file in static/*.js; do node --check "$file"; done

      - name: Build installer
        run: python -B scripts/build_release.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/token-lens-${GITHUB_REF_NAME}-macos.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --title "Token Lens ${GITHUB_REF_NAME}" --generate-notes
